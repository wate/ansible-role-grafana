---
- name: Install dependency packages
  ansible.builtin.apt:
    name:
      - python3-apt
      - python3-debian
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
- name: Create GPG key directory
  ansible.builtin.file:
    path: "{{ grafana_apt_key_dest | dirname }}"
    state: directory
    mode: "0755"
- name: Download GPG key
  ansible.builtin.get_url:
    url: "{{ grafana_apt_key_url }}"
    dest: "{{ grafana_apt_key_download_dest }}"
    mode: "0644"
  register: gpg_key_download_result
- name: Convert GPG key
  ansible.builtin.command:
    cmd: gpg --dearmor -o {{ grafana_apt_key_dest }} {{ grafana_apt_key_download_dest }}
  when: gpg_key_download_result is changed
- name: Add grafana repository
  ansible.builtin.deb822_repository:
    name: grafana
    uris: https://packages.grafana.com/oss/deb
    suites: stable
    components: main
    signed_by: "{{ grafana_apt_key_dest }}"
    enabled: true
    state: present
  register: apt_repository_result
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  when: apt_repository_result is changed
